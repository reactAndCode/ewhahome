name: Deploy Next.js Blog & Website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'blog/package-lock.json'

      - name: Install Dependencies
        working-directory: blog
        run: npm install

      - name: Build Next.js Blog (Static Export)
        working-directory: blog
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: '/blog'

      - name: Prepare Site for GitHub Pages
        run: |
          mkdir -p _site
          # 1. 루트 홈페이지 정적 에셋 복사
          cp index.html _site/
          cp -r *.jpg *.png _site/ 2>/dev/null || true
          [ -f CNAME ] && cp CNAME _site/

          # 2. 루트 /img/ 경로 생성 및 모든 이미지 복사 (/img/... 요청 대응)
          mkdir -p _site/img
          cp -r *.jpg *.png _site/img/ 2>/dev/null || true
          cp -r blog/public/img/* _site/img/ 2>/dev/null || true

          # 3. Next.js 빌드 산출물을 /blog 경로로 복사
          mkdir -p _site/blog
          cp -r blog/out/* _site/blog/

          # 4. /blog/img/ 에도 모든 이미지 복사 (/blog/img/... 요청 대응)
          mkdir -p _site/blog/img
          cp -r *.jpg *.png _site/blog/img/ 2>/dev/null || true
          cp -r blog/public/img/* _site/blog/img/ 2>/dev/null || true

          # 5. Jekyll 무시 방지 (.nojekyll 생성: _next 폴더 서빙 필수)
          touch _site/.nojekyll
          touch _site/blog/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
