<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이화미술 - 카드뉴스</title>
  
  <!-- 카카오톡 / SNS 공유 Open Graph 메타태그 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="이화아트스쿨 카드뉴스">
  <meta property="og:description" content="이화아트스쿨 카드뉴스를 확인해보세요.">
  <meta property="og:image" content="https://www.ewhaart.co.kr/blog/cardNews/img/01_cover.png">
  <meta property="og:url" content="https://www.ewhaart.co.kr/blog/cardNews/261022">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="이화아트스쿨 카드뉴스">
  <meta name="twitter:description" content="이화아트스쿨 카드뉴스를 확인해보세요.">
  <meta name="twitter:image" content="https://www.ewhaart.co.kr/blog/cardNews/img/01_cover.png">

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 600px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px 5px 10px;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid #2dd4bf;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 2px 10px rgba(45, 212, 191, 0.2);
      transition: all 0.2s ease;
    }
    .logo-badge:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(45, 212, 191, 0.35);
      border-color: #14b8a6;
    }
    .logo-crown-icon {
      color: #0d9488;
      display: flex;
      align-items: center;
    }
    .logo-text-group {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .logo-main-text {
      font-size: 0.95rem;
      font-weight: 900;
      color: #0f766e;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .logo-sub-text {
      font-size: 0.62rem;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.3px;
    }
    .share-btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .share-btn:active {
      transform: scale(0.96);
    }
    .card-container {
      width: 100%;
      max-width: 540px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px 16px 24px;
    }
    .swiper {
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      background: #1e293b;
    }
    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    .swiper-slide img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .swiper-pagination {
      position: relative !important;
      margin-top: 18px;
    }
    .swiper-pagination-bullet {
      background: #94a3b8 !important;
      opacity: 0.5;
      width: 8px;
      height: 8px;
      transition: all 0.25s ease;
    }
    .swiper-pagination-bullet-active {
      background: #38bdf8 !important;
      opacity: 1;
      width: 24px;
      border-radius: 4px;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 0 10px;
    }
    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .nav-btn:disabled, .nav-btn.swiper-button-disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .counter {
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 1px;
    }
    .counter span {
      color: #38bdf8;
      font-weight: 700;
    }
    .actions-bar {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .home-link-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 13px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .home-link-btn:hover {
      background: #334155;
      border-color: #38bdf8;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <a href="https://www.ewhaart.co.kr" class="logo-badge" title="이화미술공작소 홈">
      <span class="logo-crown-icon">
        <svg width="20" height="18" viewBox="0 0 24 20" fill="currentColor">
          <path d="M2 18h20v2H2v-2zm1-5l4-8 5 5 5-5 4 8H3z"/>
        </svg>
      </span>
      <div class="logo-text-group">
        <span class="logo-main-text">
          EWHA ART 
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </span>
        <span class="logo-sub-text">이화미술공작소 · KIDS ATELIER</span>
      </div>
    </a>
    <button class="share-btn" onclick="shareCardNews()">공유하기</button>
  </header>

  <main class="card-container">
    <div class="swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="img/01_cover.png" alt="카드뉴스 1"></div>
        <div class="swiper-slide"><img src="img/02_card1.png" alt="카드뉴스 2"></div>
        <div class="swiper-slide"><img src="img/03_card2.png" alt="카드뉴스 3"></div>
        <div class="swiper-slide"><img src="img/04_card3.png" alt="카드뉴스 4"></div>
        <div class="swiper-slide"><img src="img/05_card4.png" alt="카드뉴스 5"></div>
        <div class="swiper-slide"><img src="img/06_card5.png" alt="카드뉴스 6"></div>
        <div class="swiper-slide"><img src="img/07_end.png" alt="카드뉴스 7"></div>
      </div>
    </div>

    <div class="swiper-pagination"></div>

    <div class="controls">
      <button class="nav-btn btn-prev" aria-label="이전 카드">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="counter"><span id="curr-idx">1</span> / 7</div>
      <button class="nav-btn btn-next" aria-label="다음 카드">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>

    <div class="actions-bar">
      <a href="https://www.ewhaart.co.kr" class="home-link-btn">
        홈페이지 바로가기 ↗
      </a>
      <a href="https://www.ewhaart.co.kr/blog" class="home-link-btn">
        블로그 소식 보기 ↗
      </a>
    </div>
  </main>

  <div id="toast" class="toast">링크가 클립보드에 복사되었습니다!</div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('.swiper', {
      slidesPerView: 1,
      spaceBetween: 10,
      grabCursor: true,
      pagination: {
        el: '.swiper-pagination',
        clickable: true,
      },
      navigation: {
        nextEl: '.btn-next',
        prevEl: '.btn-prev',
      },
      on: {
        slideChange: function () {
          document.getElementById('curr-idx').innerText = this.realIndex + 1;
        }
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (msg) toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    async function shareCardNews() {
      const shareData = {
        title: '이화아트스쿨 카드뉴스',
        text: '이화아트스쿨 카드뉴스를 확인해보세요.',
        url: window.location.href,
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          if (err.name !== 'AbortError') {
            copyUrl();
          }
        }
      } else {
        copyUrl();
      }
    }

    function copyUrl() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        showToast('링크가 클립보드에 복사되었습니다!');
      }).catch(() => {
        const temp = document.createElement('input');
        temp.value = window.location.href;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast('링크가 클립보드에 복사되었습니다!');
      });
    }
  </script>
</body>
</html>
